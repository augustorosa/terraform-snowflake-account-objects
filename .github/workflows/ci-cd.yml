name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  TERRAFORM_VERSION: "1.10.5"
  SNOWFLAKE_PROVIDER_VERSION: "2.3.0"
  GO_VERSION: "1.21"
  TFLINT_VERSION: "v0.48.0"
  TFSEC_VERSION: "v1.28.4"

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  validate:
    name: Validate & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: Init TFLint
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run TFLint
        run: tflint --recursive

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Validate Terraform
        run: |
          # Validate root module
          echo "Validating root module"
          terraform init -backend=false
          terraform validate
          
          # Validate examples if they exist (examples are validated separately in examples-validation job)
          echo "Examples will be validated in the examples-validation job"

      - name: Validate YAML Configurations
        run: |
          pip install yamllint
          if [ -d "docs/config-patterns" ]; then
            yamllint -c .yamllint docs/config-patterns/ || echo "YAML validation warnings (non-blocking)"
          else
            echo "No docs/config-patterns directory found, skipping YAML validation"
          fi

  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          version: ${{ env.TFSEC_VERSION }}
          soft_fail: false

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          hide-progress: false
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload Trivy Results
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          # Don't wait for processing to avoid blocking PRs
          wait-for-processing: false

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        continue-on-error: true
        with:
          directory: .
          framework: terraform
          output_format: sarif
          output_file_path: checkov-results.sarif

      - name: Upload Checkov Results
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        if: always()
        with:
          sarif_file: checkov-results.sarif
          # Don't wait for processing to avoid blocking PRs
          wait-for-processing: false

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [validate]
    strategy:
      matrix:
        test-suite:
          - foundation
          - rbac
          - database
          - warehouse
          - integration
          - security
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Cache Go Modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install Dependencies
        run: |
          cd tests
          go mod download
          go install github.com/jstemmer/go-junit-report/v2@latest

      - name: Run Unit Tests - ${{ matrix.test-suite }}
        run: |
          cd tests
          go test -v -timeout 30m -run Test${{ matrix.test-suite }} ./unit/... | \
            go-junit-report -set-exit-code > unit-test-${{ matrix.test-suite }}.xml
        env:
          TF_ACC: "0"

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results-${{ matrix.test-suite }}
          path: tests/unit-test-${{ matrix.test-suite }}.xml

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [unit-tests, security]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Check for Snowflake Secrets
        id: check-secrets
        run: |
          if [ -z "${{ secrets.SNOWFLAKE_ACCOUNT }}" ] || [ -z "${{ secrets.SNOWFLAKE_USER }}" ] || [ -z "${{ secrets.SNOWFLAKE_PASSWORD }}" ]; then
            echo "has_secrets=false" >> $GITHUB_OUTPUT
            echo "⚠️ Snowflake secrets not configured. Skipping integration tests."
          else
            echo "has_secrets=true" >> $GITHUB_OUTPUT
          fi

      - name: Run Integration Tests
        if: steps.check-secrets.outputs.has_secrets == 'true'
        continue-on-error: true
        run: |
          cd tests
          go test -v -timeout 45m -run TestIntegration ./integration/...
        env:
          TF_ACC: "1"
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}

  examples-validation:
    name: Validate Examples
    runs-on: ubuntu-latest
    needs: [validate]
    strategy:
      matrix:
        example:
          - comprehensive
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Validate Example - ${{ matrix.example }}
        run: |
          if [ ! -d "examples/${{ matrix.example }}" ]; then
            echo "Example directory examples/${{ matrix.example }} does not exist, skipping"
            exit 0
          fi
          cd examples/${{ matrix.example }}
          terraform init -backend=false
          terraform validate
          # Only run plan if tfvars.example exists
          if [ -f terraform.tfvars.example ]; then
            terraform plan -input=false -var-file=terraform.tfvars.example || echo "Plan failed (may require additional variables)"
          else
            echo "No terraform.tfvars.example found, skipping plan"
          fi

  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    needs: [unit-tests, security, examples-validation]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Semantic Release Dependencies
        run: |
          npm install -g \
            semantic-release \
            @semantic-release/git \
            @semantic-release/github \
            @semantic-release/changelog \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator \
            conventional-changelog-conventionalcommits

      - name: Create VERSION file if not exists
        run: |
          if [ ! -f VERSION ]; then
            echo "0.0.0" > VERSION
          fi

      - name: Run Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

  publish-docs:
    name: Publish Documentation
    runs-on: ubuntu-latest
    needs: [release]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MkDocs
        run: |
          pip install mkdocs mkdocs-material mkdocs-mermaid2-plugin

      - name: Build Documentation
        run: mkdocs build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site 